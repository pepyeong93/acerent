<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>후기 이벤트 이미지</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; }
  .banner { position: relative; width: 1280px; height: 720px; background: #fff; display: flex; }
  .left { flex: 1; padding: 74px 0 0 80px; position: relative; z-index: 2; }
  .tag { display: inline-block; background: #C8102E; color: #fff; font-size: 26px; font-weight: 700; padding: 10px 22px; letter-spacing: 1px; }
  h1 { margin: 30px 0 0; font-size: 78px; line-height: 1.12; font-weight: 800; color: #111; letter-spacing: -3px; }
  h1 em { font-style: normal; color: #C8102E; }
  .sub { margin: 26px 0 0; font-size: 27px; line-height: 1.55; color: #333; letter-spacing: -0.5px; }
  .steps { margin-top: 38px; display: flex; gap: 10px; }
  .step { border: 2px solid #111; padding: 11px 15px; font-size: 20px; font-weight: 700; color: #111; display: flex; align-items: center; gap: 10px; }
  .step b { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; background: #111; color: #fff; font-size: 18px; }
  .arrow { align-self: center; font-size: 26px; color: #C8102E; font-weight: 700; }
  .note { position: absolute; left: 80px; bottom: 40px; font-size: 19px; color: #777; }
  .right { position: absolute; right: 0; top: 0; width: 360px; height: 720px; background: #C8102E; }
  .right::before { content: ''; position: absolute; left: -110px; top: 0; border-top: 720px solid #C8102E; border-left: 110px solid transparent; }
  .cup { position: absolute; right: 70px; top: 150px; transform: scale(.88); transform-origin: right top; z-index: 3; }
  .brand { position: absolute; right: 64px; bottom: 44px; color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 1px; z-index: 3; text-align: right; }
  .brand small { display: block; font-size: 18px; font-weight: 400; opacity: .9; margin-top: 4px; letter-spacing: 0; }
</style></head>
<body>
<div class="banner">
  <div class="right"></div>
  <div class="left">
    <span class="tag">이용후기 이벤트</span>
    <h1>후기 남기고<br><em>커피</em> 받아 가세요!</h1>
    <p class="sub">에이스렌터카 단기렌트 이용 후 후기를 남겨 주시면<br>확인 후 <strong>커피 쿠폰</strong>을 문자로 보내드립니다.</p>
    <div class="steps">
      <span class="step"><b>1</b>렌터카 이용</span><span class="arrow">›</span>
      <span class="step"><b>2</b>홈페이지 후기 작성</span><span class="arrow">›</span>
      <span class="step"><b>3</b>커피 쿠폰 받기</span>
    </div>
  </div>
  <svg class="cup" width="360" height="400" viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- 김 -->
    <path d="M120 70 C100 45 140 35 120 8" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M165 78 C145 50 185 40 165 12" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M210 70 C190 45 230 35 210 8" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
    <!-- 뚜껑 -->
    <rect x="52" y="96" width="226" height="26" rx="8" fill="#111"/>
    <rect x="70" y="80" width="190" height="24" rx="8" fill="#222"/>
    <!-- 컵 -->
    <path d="M66 122 L264 122 L240 372 Q238 388 222 388 L108 388 Q92 388 90 372 Z" fill="#fff"/>
    <!-- 슬리브 -->
    <path d="M76 205 L254 205 L245 298 L85 298 Z" fill="#111"/>
    <text x="165" y="262" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="800" fill="#fff">COFFEE</text>
    <!-- 쿠폰 -->
    <g transform="translate(196 300) rotate(-12)">
      <rect x="0" y="0" width="128" height="70" rx="6" fill="#FFD84D"/>
      <circle cx="0" cy="35" r="10" fill="#C8102E"/><circle cx="128" cy="35" r="10" fill="#C8102E"/>
      <line x1="38" y1="8" x2="38" y2="62" stroke="#111" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="84" y="44" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="800" fill="#111">FREE</text>
    </g>
  </svg>
  <div class="brand">에이스렌터카<small>24시간 예약상담 1644-8891</small></div>
  <p class="note">※ 휴대폰 번호 1개당 이용 1건 기준 · 후기 확인 후 발송됩니다.</p>
</div>
</body></html>
